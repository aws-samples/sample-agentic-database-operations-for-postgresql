# Check registry — the router/workflow catalog. Keyed by a human SLUG (the
# primary identity used by the router, skills, and tools). `catalog_id` (e.g.
# CHK-NNN) is a stable traceability id for following a check across revisions —
# it is NEVER surfaced to users (use `display_name`). Thresholds live in
# references.yaml (see `thresholds_ref`); SQL lives in the tool. Add a check =
# add an entry here + its skill/SOP (no router code change).

checks:
  vacuum-and-bloat:
    display_name: "Table Bloat & Autovacuum"
    catalog_id: CHK-007
    category: "MAINTENANCE & HEALTH"
    priority: critical
    engines: [aurora-postgresql, rds-postgresql, self-managed-postgresql]
    pg_version_compat: "RDS/Aurora PG 11-18 (+ Extended Support 11/12), Aurora Serverless v2; self-managed 9.4+"
    # Symptom vocabulary for the deterministic router (keyword match; embeddings later).
    triggers:
      - bloat
      - table bloat
      - dead tuple
      - dead tuples
      - autovacuum
      - vacuum
      - vacuum full
      - pg_repack
      - storage growing
      - storage keeps growing
      - keeps growing
      - table growing
      - disk growing
      - reclaim space
      - wasted space
    skill: vacuum-and-bloat
    # test_tools: granular tool list for the golden-harness / test-scoping ONLY. NOT a runtime
    # fence. The skill's SKILL.md `allowed-tools` frontmatter is advisory too (skill-authoring
    # guidance); it is stripped from the injected skill body and no runtime code reads it. The
    # actual bound on what an agent may call is the fixed tool set each agent is constructed with
    # per surface (chat vs investigation), and every one of those tools is read-only. Informational.
    test_tools:
      - get_vacuum_stats_health
      - get_db_configuration
      - get_current_activity
      - get_lock_analysis
      - get_insert_autovacuum_lag
      - get_historical_metrics
      - observability_agent
    thresholds_ref: "checks/references.yaml#vacuum-and-bloat"
    temporal_default: conjunction
    # Recommended run cadence for this check.
    # GUIDANCE/default only — a sensible scan cadence + a hint the agent can weigh;
    # NOT a hard restriction. CHK-007 is a point-in-time state check, so this is a
    # frequency, not a lookback window. Aligns with the Tier-2 "Daily" default.
    recommended_frequency: "daily; hourly for known high-write workloads"

  xid-wraparound-database:
    display_name: "Transaction ID Wraparound (Database)"
    catalog_id: CHK-001
    category: "MAINTENANCE & HEALTH"
    priority: critical
    engines: [aurora-postgresql, rds-postgresql, self-managed-postgresql]
    pg_version_compat: "RDS/Aurora PG 11-18 (+ Extended Support 11/12), Aurora Serverless v2; self-managed 8.0+"
    triggers:
      - xid
      - xid age
      - transaction id age
      - wraparound
      - transaction id wraparound
      - datfrozenxid
      - freeze
      - vacuum to prevent wraparound
      - maximumusedtransactionids
      - read-only shutdown
    skill: transaction-wraparound
    # Shared with xid-wraparound-table (same tool); scoped superset for the investigation.
    test_tools:
      - get_maintenance_status
      - get_current_activity
      - get_db_configuration
      - get_historical_metrics
      - observability_agent
    thresholds_ref: "checks/references.yaml#xid-wraparound-database"
    temporal_default: live
    recommended_frequency: "daily (minimum); hourly for high-write workloads"
    investigation_lookback: "30 days (Period=5min) for MaximumUsedTransactionIDs trend"
    alert_window: "last 1 hour"

  xid-wraparound-table:
