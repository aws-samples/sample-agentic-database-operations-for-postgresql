# Dependabot keeps the pinned dependencies and base-image digests from silently going
# stale. Security updates for known CVEs open a pull request as soon as a fix is
# published. Routine version updates run monthly and are grouped so that each ecosystem
# gets one pull request for its minor and patch bumps; a major version bump always gets
# its own pull request, because it needs a maintainer's judgement. A maintainer reviews
# and merges the PRs.
#
# After a Python dependency PR, refresh the hashed locks with `make lock` (Dependabot
# updates the declared versions; the --require-hashes locks are regenerated from them).
version: 2
updates:
  # ── Python dependencies ──
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/batch"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # ── Container base images (digest pins) ──
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
  - package-ecosystem: "docker"
    directory: "/batch"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
  - package-ecosystem: "docker"
    directory: "/admin-console"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  # ── Front-end JavaScript dependencies ──
  - package-ecosystem: "npm"
    directory: "/admin-console"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
